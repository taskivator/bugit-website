<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · BugIt</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/public/brand/favicon.svg" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; text-align: center; padding: 24px;
      background: #0b0614; color: #e9e3f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box { max-width: 460px; }
    h1 { font-size: 64px; margin: 12px 0 8px; letter-spacing: -0.02em; }
    p { color: #a99fc0; line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 12px 20px; border-radius: 12px;
      background: linear-gradient(90deg, #8b5cf6, #ff4fc9);
      color: #fff; text-decoration: none; font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/public/brand/blip-logo.svg" alt="" width="72" height="72" />
    <h1>404</h1>
    <p id="nf-body">That page doesn’t exist. The link may be mistyped, or the page may have moved.</p>
    <a id="nf-home" href="/">Back to home</a>
  </div>
  <!--
    English is in the markup, so this page is correct with no JavaScript at all. /404.js only
    swaps the two strings for the reader's saved language, and it is an EXTERNAL file because
    the site's CSP is `script-src 'self'` with no unsafe-inline and no nonce: an inline script
    here would be blocked, silently, on the one page nobody tests.

    Its strings are generated at build time from the same table app.js renders the in-app
    not-found view from, so the two cannot drift.
  -->
  <script src="/404.js" defer></script>
</body>
</html>
