<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BugIt Blip">
<style>
.blip-float{transform-box:view-box;transform-origin:50px 62px;animation:bF 3.4s ease-in-out infinite}
@keyframes bF{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.7deg)}}
.blip-eye{transform-box:view-box;transform-origin:50px 50px;animation:bB 4.8s ease-in-out infinite}
@keyframes bB{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}}
.blip-look{transform-box:view-box;transform-origin:50px 50px;animation:bL 6.4s ease-in-out infinite}
@keyframes bL{0%,26%{transform:translate(0,0)}40%,58%{transform:translate(3px,.4px)}72%,90%{transform:translate(-2.4px,0)}100%{transform:translate(0,0)}}
.blip-glow{transform-box:view-box;transform-origin:50px 56px;opacity:.16;animation:bG 2.8s ease-in-out infinite}
@keyframes bG{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.28;transform:scale(1.08)}}
.blip-tool{transform-box:view-box;transform-origin:66px 64px;animation:bT 3.1s ease-in-out infinite}
@keyframes bT{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(7deg) translateY(-1.4px)}}
.blip-dot{transform-box:view-box;animation:bD 1.5s ease-in-out infinite}
.blip-dot.d2{animation-delay:.18s}
.blip-dot.d3{animation-delay:.36s}
@keyframes bD{0%,62%,100%{opacity:.35;transform:translateY(0)}28%{opacity:1;transform:translateY(-1.7px)}}
@media(prefers-reduced-motion:reduce){.blip-float,.blip-eye,.blip-look,.blip-glow,.blip-tool,.blip-dot{animation:none}}
</style>
<defs>
<linearGradient id="bg_guide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2E9A"/><stop offset="1" stop-color="#C21C79"/></linearGradient>
<filter id="bf_guide" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="body_clip_guide"><rect x="20" y="22" width="60" height="60" rx="20"/></clipPath>
</defs>
<ellipse class="blip-glow" cx="50" cy="56" rx="33" ry="35" fill="#FF2E9A" filter="url(#bf_guide)"/>
<g class="blip-float">
<rect x="30" y="82" width="12" height="8" rx="4" fill="#C21C79"/><rect x="58" y="82" width="12" height="8" rx="4" fill="#C21C79"/>
<rect x="20" y="22" width="60" height="60" rx="20" fill="url(#bg_guide)"/>
<rect x="20" y="22" width="60" height="30" rx="20" fill="#ffffff" opacity="0.12" clip-path="url(#body_clip_guide)"/>
<g class="blip-eye"><circle cx="50" cy="50" r="15" fill="#17101a"/><circle cx="50" cy="50" r="9.3" fill="#17101a"/>
<g class="blip-look"><circle cx="45.8" cy="44.9" r="4.5" fill="#ffffff"/><circle cx="53.9" cy="54.5" r="2.1" fill="#ffffff" opacity="0.55"/></g></g>
<path d="M43 68 Q50 74.3 57 68" fill="none" stroke="#17101a" stroke-width="2.38" stroke-linecap="round"/>
<g class="blip-tool"><g transform="translate(66 64) scale(1.16)"><path d="M-11 -8 H9 A3.6 3.6 0 0 1 12.6 -4.4 V3.4 A3.6 3.6 0 0 1 9 7 H-1.4 L-6.6 11.4 V7 H-11 A3.6 3.6 0 0 1 -14.6 3.4 V-4.4 A3.6 3.6 0 0 1 -11 -8 Z" fill="#ffffff" stroke="#17101a" stroke-width="2"/><circle class="blip-dot" cx="-6" cy="-.5" r="1.9" fill="#17101a"/><circle class="blip-dot d2" cx="-.6" cy="-.5" r="1.9" fill="#17101a"/><circle class="blip-dot d3" cx="4.8" cy="-.5" r="1.9" fill="#17101a"/></g></g>
</g>
</svg>