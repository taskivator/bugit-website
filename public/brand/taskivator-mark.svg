<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taskivator">
<style>
.blip-float{transform-box:view-box;transform-origin:50px 62px;animation:bF 3.4s ease-in-out infinite}
@keyframes bF{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.7deg)}}
.blip-eye{transform-box:view-box;transform-origin:50px 50px;animation:bB 4.8s ease-in-out infinite}
@keyframes bB{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}}
.blip-look{transform-box:view-box;transform-origin:50px 50px;animation:bL 6.4s ease-in-out infinite}
@keyframes bL{0%,26%{transform:translate(0,0)}40%,58%{transform:translate(3px,.4px)}72%,90%{transform:translate(-2.4px,0)}100%{transform:translate(0,0)}}
.blip-glow{transform-box:view-box;transform-origin:50px 56px;opacity:.16;animation:bG 2.8s ease-in-out infinite}
@keyframes bG{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.28;transform:scale(1.08)}}
.blip-tool{transform-box:view-box;transform-origin:63px 63px;animation:bT 3.1s ease-in-out infinite}
@keyframes bT{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(7deg) translateY(-1.4px)}}
@media(prefers-reduced-motion:reduce){.blip-float,.blip-eye,.blip-look,.blip-glow,.blip-tool{animation:none}}
.tk-knob{transform-box:view-box;animation:tkK .7s cubic-bezier(.5,1.8,.4,1) .5s both}
.tk-track{transform-box:fill-box;transform-origin:left center;animation:tkT .45s ease-out .55s both}
.tk-gem{transform-box:fill-box;transform-origin:center;animation:tkG 5.6s ease-in-out 1.4s infinite}
@keyframes tkK{from{transform:translateX(-11px)}to{transform:translateX(0)}}
@keyframes tkT{from{opacity:0;transform:scaleX(.35)}to{opacity:1;transform:scaleX(1)}}
@keyframes tkG{0%,86%,100%{filter:none;transform:scale(1)}91%{filter:brightness(1.8);transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.tk-knob,.tk-track,.tk-gem{animation:none}}
</style>
<defs>
<linearGradient id="bg_tk" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#40335e"/><stop offset="0.45" stop-color="#1b1430"/><stop offset="1" stop-color="#0a0712"/></linearGradient><linearGradient id="gold_tk" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset="0.45" stop-color="#f2c86b"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
<filter id="bf_tk" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="clip_tk"><rect x="20" y="22" width="60" height="60" rx="20"/></clipPath>
</defs>
<ellipse class="blip-glow" cx="50" cy="56" rx="33" ry="35" fill="#f2c86b" filter="url(#bf_tk)"/>
<g class="blip-float">
<rect x="30" y="82" width="12" height="8" rx="4" fill="#a57a26"/><rect x="58" y="82" width="12" height="8" rx="4" fill="#a57a26"/>
<rect x="20" y="22" width="60" height="60" rx="20" fill="url(#bg_tk)"/>
<rect x="20" y="22" width="60" height="30" rx="20" fill="#ffffff" opacity="0.12" clip-path="url(#clip_tk)"/>
<g class="blip-eye"><circle cx="50" cy="50" r="15" fill="#17101a"/><circle cx="50" cy="50" r="9.3" fill="#17101a"/>
<g class="blip-look"><circle cx="45.8" cy="44.9" r="4.5" fill="#ffffff"/><circle cx="53.9" cy="54.5" r="2.1" fill="#ffffff" opacity="0.55"/></g></g>
<path d="M43 68 Q50 74.3 57 68" fill="none" stroke="#f2c86b" stroke-width="2.38" stroke-linecap="round"/>

<rect x="20.7" y="22.7" width="58.6" height="58.6" rx="19.3" fill="none" stroke="url(#gold_tk)" stroke-width="1.5"/><circle cx="50" cy="50" r="16.4" fill="none" stroke="url(#gold_tk)" stroke-width="2.4"/><g transform="translate(0 1) rotate(-12 50 21)"><path d="M37.5 21.5 L35.5 10.5 L43.2 15.6 L50 6.5 L56.8 15.6 L64.5 10.5 L62.5 21.5 Z" fill="url(#gold_tk)" stroke="#17101a" stroke-width="1.3" stroke-linejoin="round"/><circle class="tk-gem" cx="50" cy="16.4" r="1.9" fill="#32f28c" stroke="#17101a" stroke-width=".8"/><circle cx="35.5" cy="10.5" r="1.3" fill="url(#gold_tk)" stroke="#17101a" stroke-width=".7"/><circle cx="50" cy="6.5" r="1.3" fill="url(#gold_tk)" stroke="#17101a" stroke-width=".7"/><circle cx="64.5" cy="10.5" r="1.3" fill="url(#gold_tk)" stroke="#17101a" stroke-width=".7"/></g><g class="blip-tool"><g transform="translate(63 63)"><rect x="-12" y="-6.5" width="24" height="13" rx="6.5" fill="#ffffff" stroke="#17101a" stroke-width="1.6"/><rect class="tk-track" x="-10" y="-4.5" width="20" height="9" rx="4.5" fill="#32f28c"/><circle class="tk-knob" cx="5.5" cy="0" r="5.2" fill="#ffffff" stroke="#17101a" stroke-width="1.4"/></g></g>
</g>
</svg>