<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Narrowing a regression</title>
<desc id="d">A timeline of example builds with the last known good build and the first known bad build marked, and an arrow showing the gap being narrowed.</desc>
<rect width="1200" height="630" fill="#0b0614"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="60" y="68" font-size="30" font-weight="700" fill="#f6f1ff">Find the last good build and the first bad one</text>
<path d="M90 300H1110" stroke="#4a3d63" stroke-width="4" stroke-linecap="round"/>
<g font-size="20" text-anchor="middle" fill="#cfc4e2">
<circle cx="150" cy="300" r="16" fill="#32f28c"/><text x="150" y="350">2.12</text>
<circle cx="330" cy="300" r="16" fill="#32f28c"/><text x="330" y="350">2.13</text>
<circle cx="510" cy="300" r="16" fill="#32f28c"/><text x="510" y="350">2.13.2</text>
<circle cx="690" cy="300" r="16" fill="#ff5b72"/><text x="690" y="350">2.14.0</text>
<circle cx="870" cy="300" r="16" fill="#ff5b72"/><text x="870" y="350">2.14.1</text>
<circle cx="1050" cy="300" r="16" fill="#ff5b72"/><text x="1050" y="350">2.15</text>
</g>
<g font-size="18" font-weight="700">
<rect x="425" y="170" width="170" height="64" rx="14" fill="#140f22" stroke="#32f28c" stroke-opacity=".8"/>
<text x="510" y="198" text-anchor="middle" fill="#f6f1ff">Last known good</text><text x="510" y="222" text-anchor="middle" font-weight="400" font-size="14" fill="#cfc4e2">Steps work</text>
<rect x="605" y="170" width="170" height="64" rx="14" fill="#140f22" stroke="#ff5b72" stroke-opacity=".8"/>
<text x="690" y="198" text-anchor="middle" fill="#f6f1ff">First known bad</text><text x="690" y="222" text-anchor="middle" font-weight="400" font-size="14" fill="#cfc4e2">Same steps fail</text>
</g>
<path d="M510 250V284M690 250V284" stroke="#9a8fb0" stroke-width="2"/>
<path d="M526 410H674M526 410l14-9M526 410l14 9M674 410l-14-9M674 410l-14 9" stroke="#ff4fc9" stroke-width="3" stroke-linecap="round" fill="none"/>
<text x="600" y="450" font-size="20" text-anchor="middle" fill="#ff7ad9" font-weight="700">The change is in here</text>
<rect x="60" y="500" width="1080" height="64" rx="14" fill="#140f22" stroke="#8b45ff" stroke-opacity=".6"/>
<text x="90" y="540" font-size="19" fill="#cfc4e2">Check the release notes, settings and dependencies between the two builds, then name both builds in the report.</text>
<text x="60" y="605" font-size="16" fill="#9a8fb0">Example build numbers for illustration · BugIt by Taskivator · bugit.dev</text>
</g>
</svg>
