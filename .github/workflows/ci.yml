name: CI

# Push-based CI (same-repo): a separate pull_request trigger would only duplicate
# runs on the same commit. Only skip files that are NOT part of the static build
# (build.js bundles the HTML/CSS/JS + public/, so those must still trigger CI).
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel superseded in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated rather than inherited. This repository is PUBLIC, so its workflow
# file and its logs are world-readable and the token's scope is worth being explicit about.
# The repository default is already `read` (checked 2026-09-23 via
# /actions/permissions/workflow); pinning it here means a later settings change cannot widen
# it silently. Nothing in this job writes to the repository: CI build-verifies only, and the
# deploy is a separate manual `npm run deploy`.
permissions:
  contents: read

# Marketing site is static and dependency-free: prove it builds, its assets
# resolve, and the deployable output is produced.
jobs:
  build:
    runs-on: ubuntu-latest
    # A CEILING, because there was none and GitHub's default is 360 minutes. A full run
    # here measures about 140 minutes -- nearly every step drives headless Chrome across
    # eleven widths, ten routes and ten languages -- so a job still going at 240 is
    # wedged, not slow. Without this a single hung step burns four hours of runner time
    # and reports nothing. The agent repo put a ceiling on every job for exactly this
    # reason; this repository never got the lesson until 2026-09-04.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Committed-secret scan. It lives in scripts/ rather than in an inline `run:` block here,
      # and that IS the fix. An inline CI step has no local counterpart, and
      # scripts/check-ci-coverage.mjs -- the guard whose entire job is to stop this list and
      # `npm test` drifting apart -- is directional: it requires every scripts/check-*.mjs to
      # appear in this file, and cannot see a CI step that has no script. So on 2026-09-23 the
      # full local suite ran 29 guards, passed, and the commit it passed on went red here. As a
      # scripts/check-*.mjs it is now run by `npm test` AND required by check-ci-coverage to
      # stay wired into this file.
      #
      # It runs after setup-node because it is a node script, and still before `npm ci` because
      # it has no dependencies. It names files and never prints the matching text (this
      # repository is PUBLIC, and a build log is durable), and it reads git grep's exit status
      # so a scan that could not run cannot report a clean tree. It also plants a synthetic
      # credential and requires itself to find it before believing a zero.
      - name: Secret scan
        run: node scripts/check-committed-secrets.mjs
      # The Cloudflare token is looked up in ONE module, and found from a linked git worktree
      # (a fabricated token in a throwaway workspace; nothing real is read).
      - name: Token lookup works from a worktree
        run: node scripts/check-token-lookup.mjs
      # Build-time devDependency only (esbuild, for asset minification). The
      # shipped site stays dependency-free at runtime.
      - name: Install build tooling
        run: npm ci
      - name: Build static site
        id: build
        run: node build.js
      - name: Verify referenced assets resolve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-assets.mjs
      - name: Verify documentation links resolve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-doc-links.mjs
      # GitHub Pages had been publishing this repository's ROOT since 2026-07-06, five days
      # before bugit.dev's DNS existed, on every push to main: a second public copy of the site
      # plus server.js, build.js and every guard script, all answering 200. The problem was not
      # disclosure, this repo being public, but that the manual `wrangler pages deploy` gate --
      # the step that lets copy be reviewed before customers read it -- did not apply to it.
      # An external audit listed the Pages URL on 2026-08-03 and nobody read three origins as
      # meaning three origins, so this asks the URL rather than trusting anyone to notice.
      - name: Verify this site has only one public origin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-single-publication.mjs
      - name: Verify localized highlights and full PDF guides are complete
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-docs.mjs
      # The agent repo is not checked out here, so freshness cannot be answered in CI. The
      # guard says so loudly rather than reporting clean over a question it never asked; the
      # local suite and the deploy path DO have the agent beside them and must not set this.
      - name: Verify the served guides are the agent's current publication
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BUGIT_GUIDES_FRESHNESS_UNVERIFIABLE: "1"
        run: node scripts/check-guides-fresh.mjs
      # The online guide PAGES are a third copy of the package guides and the printed PDFs.
      # Nothing compared their wording with either until a term the round corrected in both
      # stayed live here in Spanish, Korean and Portuguese.
      - name: Verify the online guides carry no retired product vocabulary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-retired-vocabulary.mjs
      # Arabic is registered about two thousand lines below the other ten locales, so a
      # membership check made while the file is still being read answered false for it, and
      # every returning Arabic reader was served English with the language control showing
      # English as current. Cheap, and it names the cause rather than the symptom.
      - name: A language is registered before anything asks whether we ship it
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-locale-registration-order.mjs
      # Spanish and Italian address the reader informally in product copy. The register has
      # drifted twice and no structural check can see it, because a formal sentence is spelled
      # correctly and renders correctly. Contract text is exempt by exact sentence, not by page.
      - name: Spanish and Italian keep one register, and it is the informal one
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-register-es-it.mjs
      - name: bugit.dev publishes the values the verifier compares against
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-release-identity.mjs
      - name: Verify BugIt logo highlight is clipped (upper-corner artifact guard)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-logo.mjs
      - name: Verify the Guide's inline mark matches the generated one
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-guide-blip.mjs
      # The brand source of truth lives outside this repo and outside git, so CI
      # here cannot regenerate the assets to compare against them — which is why
      # brand staleness kept going unnoticed twice, each time as a pipeline step
      # that reported success into a folder nothing builds from. The sync now
      # writes a receipt of every file it wrote plus its hash; this re-hashes them
      # in the tree being built. check-brand-sync.mjs is itself generated and
      # covered by that receipt, so editing the detector fails the detector.
      - name: Verify brand assets match the brand pipeline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-brand-sync.mjs
      - name: Verify trust cards have no retired glyphs beside their SVG icons
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-trust-icons.mjs
      # The 2026-08-12 audit (F-08) found five directly-filed trackers advertised as
      # needing an MCP server, because the localized lede was corrected and the grouping
      # beside it was not. This asserts the site matches tracker_routing.FILEABLE.
      - name: Verify tracker capability claims match what BugIt files to
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-tracker-claims.mjs

      # The 2026-09-02 audit (round 2, F-01) found the "Runs in VS Code" card requiring
      # GitHub Copilot in Arabic, and requiring it in French one sentence after saying the
      # Claude extension works. A false purchase requirement, above the pricing block.
      - name: No locale states GitHub Copilot as a requirement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-capability-claims.mjs

      - name: Attachment claim is stated in every language
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-attachment-claim.mjs
      - name: Verify Google Ads tag shape (single load, consent-first, CSP hosts)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-ads-tag.mjs
      - name: Verify immutable caching is confined to content-hashed filenames
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-cache-headers.mjs
      # Its complement: cache-headers asks what may be cached, this asks what protects the
      # response. The site shipped without any Cross-Origin-Opener-Policy because no list said
      # which security headers it sends, so nothing could notice one missing.
      - name: The Guide answers only from its bank, and never guesses
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-guide-answers.mjs

      - name: Verify every required security header is sent on /*
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-security-headers.mjs
      - name: Verify the CSP grants no unused or undisclosed telemetry destination
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-csp-telemetry.mjs

      - name: Verify the security contact is present and not about to lapse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-security-txt.mjs
      # The first search-visibility guard this site has had. Offline on purpose, so it runs on a
      # branch and before a deploy rather than after one. It holds _redirects to the routes that
      # actually exist, keeps the raw /public/docs sources out of the index, and refuses a
      # structured-data claim about a feature the site does not have.
      - name: Verify the site is reachable, indexable and correctly described
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-seo.mjs
      - name: Verify billing copy states a 1-year license with no subscription in every locale
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-billing-copy.mjs
      - name: Verify every advertised price is one the checkout actually offers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-price-matches-checkout.mjs
      - name: Verify build output exists
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -f dist/index.html
          # build.js content-hashes the CSS/JS bundles and DELETES the unhashed
          # originals (commit 485782a), so verify the hashed bundles exist rather
          # than the fixed dist/styles.css / dist/app.js names, which never survive a build.
          ls dist/styles.*.css  >/dev/null 2>&1 || { echo "::error::hashed styles.*.css bundle missing from dist"; exit 1; }
          ls dist/app.*.js      >/dev/null 2>&1 || { echo "::error::hashed app.*.js bundle missing from dist"; exit 1; }
          test -d dist/public
          echo "Static build verified."
      # Strict prior-consent Google-tag gating — real-browser NETWORK PROOF. Consent
      # Mode v2 denied-default pings are NOT sufficient for BugIt: zero Google requests
      # before consent and after Reject; the tag loads only after Accept. One lean job,
      # single Chromium, no matrix.
      - name: Install Chromium for the consent network test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # WebKit as well as Chromium. check-disclosure.mjs runs the interaction contracts in
        # both, because the language menu shipped a defect that only Safari has: it does not
        # focus a button on tap, so the menu closed and reopened within one gesture and would
        # not collapse. Every other guard in this repo is Chromium-only and all of them passed.
        run: npx playwright install --with-deps chromium webkit
      - name: Prove strict prior-consent tag gating (browser network capture)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PORT=3123 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3123/ >/dev/null && break; sleep 0.5; done
          CONSENT_TEST_URL=http://localhost:3123 node scripts/check-consent-network.mjs
      # MOVED DOWN, and the move is the point: this guard launches Chromium and was wired eight
      # steps ABOVE the `playwright install` that provides one. It never got that far -- it died
      # first on a server it could not start -- so the ordering defect was invisible behind the
      # other one, and fixing only the server would have turned "server never came up" into
      # "Executable doesn't exist" on the next run.
      - name: Verify the not-found page is localized in every language
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-not-found.mjs
      # Eight guards below were declared in scripts/test-all.mjs but had never been run by CI,
      # so `npm test` failed locally while every push showed green. check-legal-dataflow was
      # among them: the published privacy policy had stopped disclosing the entitlement fields
      # the agent actually transmits, and nothing caught it. check-chrome-a11y was in neither
      # list and had no runner at all. The coverage guard at the end of this job is what stops
      # this from recurring: adding a scripts/check-*.mjs and forgetting to wire it is now a
      # build failure rather than a silent gap.
      - name: Verify copy that must not drift (Team, activation, legal, docs, languages)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/check-team-paused.mjs
          node scripts/check-activation-copy.mjs
          node scripts/check-legal-copy.mjs
          node scripts/check-legal-dataflow.mjs
          node scripts/check-languages.mjs
          node scripts/check-locale-crosstalk.mjs
          node scripts/check-korean-particle.mjs
          node scripts/check-doc-hygiene.mjs
          node scripts/check-doc-duplicates.mjs
          node scripts/check-doc-rendering.mjs
      # Every other locale guard SETS the bugitLang cookie before it renders, because that is
      # the documented way to drive this site. So not one of them could notice that nothing
      # ELSE ever set it: the locale chain ended in a hard coded 'en', and every first time
      # visitor on earth was served English while eleven translations sat behind a picker.
      # This is the one guard that does not set the cookie. It asks the browser instead.
      - name: Verify a first time visitor is served their own language
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-locale-fallback.mjs
      # The product's own name rendered as "BUGIT" in two places on the home page, in all
      # eleven languages, because a shared CSS rule uppercased the strings. No source grep
      # could see it: the text is correct until the stylesheet is applied. This reads the
      # rendered page instead, and proves it can see the defect before it reports a pass.
      - name: Verify the product name is never rendered in the wrong casing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-brand-casing.mjs
      # THE 2026-08-21 AUDIT, KEPT AS THREE GUARDS.
      # Every check above reads one property of the page. These read the page the way a reader
      # meets it: eleven languages, five viewports, every route, at every scroll position.
      # What they found the first time they ran: an Arabic page that cut 104px off itself at
      # 320px because a `visibility:hidden` menu is still laid out, a Mission Control stream
      # line that truncated in ALL ELEVEN languages including English, six clamps sized for the
      # shortest language the product ships, and an instrument that grew 13.5px every time the
      # report was opened. None of them was visible to a string check or a source scan.
      # Fifteen guards render against server.js, so its death is fifteen false reports of a dead
      # site -- which is exactly how it presented: ERR_CONNECTION_REFUSED on job 3 of 55. One
      # malformed percent-escape threw inside the request handler and ended the process.
      - name: Verify one bad URL cannot kill the preview server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-dev-server.mjs
      # THREE GUARDS THAT EXISTED AND NEVER RAN. check-ci-coverage names this failure in its own
      # words -- "a guard that never runs is worse than no guard: it reads as coverage" -- and
      # these three were in neither this file nor test-all.mjs SUITES. The consent one checks the
      # agreement between this site and the Portal about one shared cookie; the licence one is
      # customer copy; the build one asserts that an unapplied ads-id override and a missing
      # required root file both STOP the build instead of being reported as done.
      - name: Verify the build refuses a silent skip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-build-refuses-a-silent-skip.mjs
      - name: Verify the consent contract with the Portal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-consent-contract.mjs
      - name: Verify the licence disclosure copy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-licence-disclosure.mjs
      # Before check-routing, and it takes a second: this is the guard for the wedge that
      # stopped the whole list. A crashed renderer left isConnected() reporting true, nothing
      # relaunched, the next newContext() waited with no deadline, and the 28 suites after
      # check-routing never ran while the command still looked busy.
      - name: Verify a dead browser is replaced under a clock, never waited on
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-browser-session.mjs
      # The other half of the same lesson, one layer lower: browser-session.mjs is about a
      # browser that has already died, this is about one that has not finished starting. On
      # 2026-09-04 check-overflow went red here and green locally because Chrome was given
      # twelve seconds to open its DevTools port on a cold shared runner.
      - name: Verify a dead browser and a slow one are told apart at startup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-chrome-devtools.mjs

      - name: The Guide answers from prepared text in the browser and sends nothing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-guide.mjs
      # THE ONLY STEP HERE THAT RUNS A SECOND ENGINE. A control that declares aria-expanded must
      # open and close again, by tap and by click, in WebKit as well as Chromium. Owner,
      # 2026-08-21: "language select on mobile view does not collapse by tapping the language
      # select button" -- true on an iPhone, false in every Chromium viewport this repo tests.
      # Safari does not move focus to a button on tap, so the focused row inside the open menu
      # blurred with relatedTarget=null, the "focus has left" handler closed the menu during
      # pointerdown, and the click that followed reopened it.
      - name: Verify every disclosure closes again, in both engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-disclosure.mjs
      # Every other rule about the consent bar measures the state it ARRIVES in and then presses
      # a button to get rid of it, so the state behind "Manage preferences" had never been
      # rendered: 869px of a 640px phone, and because the bar is fixed to the bottom the extra
      # grows off the TOP of the screen where nothing can scroll to it.
      - name: Verify the consent notice fits the screen in every state it can reach
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-notice-fits.mjs
      # An overlay's CONTENTS, not just the control that opened it. The mobile menu inerted its
      # own links and its own close button: visible, opaque and completely dead to a finger.
      - name: Verify everything inside an open overlay can actually be used
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-overlay-contents.mjs
      # Firefox, for the Guide sweep below. It was installed first for check-forced-colors.mjs,
      # the only Gecko render of the single page site; that guard was retired with the page on
      # 2026-10-04 and Windows High Contrast is now held by check-published-pages.mjs (Chromium).
      - name: Install Firefox for the Guide sweep
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps firefox
      # All three engines exist by this point: chromium and webkit from the consent-test
      # install above, firefox from the line right before this one. The Guide had never been
      # opened by CI in Firefox, in WebKit, on a phone or on a tablet: check-guide.mjs is
      # Chromium at 1280x900 and nothing else.
      - name: Verify the Guide works on every engine and every screen size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-guide-devices.mjs
      # The redesign (2026-10-04): most browser guards above still read the old single page from
      # the source tree, which nobody is served any more. This one renders the BUILT pages: old
      # addresses forwarded, eleven languages at phone and desktop, consent before measurement,
      # Ask BugIt answering, with a negative control on the forwarding.
      - name: The published pages work as published
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: SKIP_BUILD=1 node scripts/check-redesign.mjs
      # What a visitor can DO on those pages (2026-10-04): docs routes and not-found, the language
      # picker by keyboard, the phone menu, 24px targets, a 10px type floor, named controls,
      # reduced motion, 320px phones, zoom. It replaces the single page guards retired with that
      # page (scripts/retired-single-page/README.md), each property with a negative control.
      - name: Verify what a visitor can do on the published pages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-published-pages.mjs
      # Reported by the owner from an iPhone on 2026-09-21: with the Guide open, swiping moved
      # the marketing page behind it. `.bgd-scroll` had overscroll-behavior:contain and that
      # cannot help -- a touch starting on the header, the composer or the padding is not inside
      # the scroller, so its policy never applies. Both of that day's reports were invisible in
      # the source and plain on screen, so this one measures a live layout rather than reading a
      # rule, and removes the lock at the wire to prove it can fail.
      - name: Verify the page behind the Guide holds still, and the mark wears no plate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-guide-scroll-lock.mjs
      - name: Verify every guard in scripts/ is actually wired into CI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-ci-coverage.mjs
