name: CI

# Push-based CI (same-repo): a separate pull_request trigger would only duplicate
# runs on the same commit. Only skip files that are NOT part of the static build
# (build.js bundles the HTML/CSS/JS + public/, so those must still trigger CI).
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel superseded in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Marketing site is static and dependency-free: prove it builds, its assets
# resolve, and the deployable output is produced.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Committed-secret scan (zero-dependency, deterministic). High-confidence
      # patterns + length anchors so nothing in this static site false-positives.
      - name: Secret scan
        run: |
          if git grep -nIE 'sk_live_[0-9a-zA-Z]{20}|sk-ant-api[0-9a-zA-Z_-]{20}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sbp_[0-9a-f]{40}|re_[0-9a-zA-Z]{24}'; then
            echo "::error::Potential committed secret detected (see matches above)"; exit 1
          fi
          echo "No committed secrets detected."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Build-time devDependency only (esbuild, for asset minification). The
      # shipped site stays dependency-free at runtime.
      - name: Install build tooling
        run: npm ci
      - name: Build static site
        run: node build.js
      - name: Verify referenced assets resolve
        run: node scripts/check-assets.mjs
      - name: Verify documentation links resolve
        run: node scripts/check-doc-links.mjs
      - name: Verify localized highlights and full PDF guides are complete
        run: node scripts/check-docs.mjs
      - name: Verify responsive pages do not overflow
        run: node scripts/check-overflow.mjs
      - name: Verify BugIt logo highlight is clipped (upper-corner artifact guard)
        run: node scripts/check-logo.mjs
      # The brand source of truth lives outside this repo and outside git, so CI
      # here cannot regenerate the assets to compare against them — which is why
      # brand staleness kept going unnoticed twice, each time as a pipeline step
      # that reported success into a folder nothing builds from. The sync now
      # writes a receipt of every file it wrote plus its hash; this re-hashes them
      # in the tree being built. check-brand-sync.mjs is itself generated and
      # covered by that receipt, so editing the detector fails the detector.
      - name: Verify brand assets match the brand pipeline
        run: node scripts/check-brand-sync.mjs
      - name: Verify trust cards have no retired glyphs beside their SVG icons
        run: node scripts/check-trust-icons.mjs
      - name: Verify Google Ads tag shape (single load, consent-first, CSP hosts)
        run: node scripts/check-ads-tag.mjs
      - name: Verify immutable caching is confined to content-hashed filenames
        run: node scripts/check-cache-headers.mjs
      - name: Verify the CSP grants no unused or undisclosed telemetry destination
        run: node scripts/check-csp-telemetry.mjs
      - name: Verify billing copy states a one-time payment in every locale
        run: node scripts/check-billing-copy.mjs
      - name: Verify build output exists
        run: |
          test -f dist/index.html
          # build.js content-hashes the CSS/JS bundles and DELETES the unhashed
          # originals (commit 485782a), so verify the hashed bundles exist rather
          # than the fixed dist/styles.css / dist/app.js names, which never survive a build.
          ls dist/styles.*.css  >/dev/null 2>&1 || { echo "::error::hashed styles.*.css bundle missing from dist"; exit 1; }
          ls dist/app.*.js      >/dev/null 2>&1 || { echo "::error::hashed app.*.js bundle missing from dist"; exit 1; }
          test -d dist/public
          echo "Static build verified."
      # Strict prior-consent Google-tag gating — real-browser NETWORK PROOF. Consent
      # Mode v2 denied-default pings are NOT sufficient for BugIt: zero Google requests
      # before consent and after Reject; the tag loads only after Accept. One lean job,
      # single Chromium, no matrix.
      - name: Install Chromium for the consent network test
        run: npx playwright install --with-deps chromium
      - name: Prove strict prior-consent tag gating (browser network capture)
        run: |
          PORT=3123 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3123/ >/dev/null && break; sleep 0.5; done
          CONSENT_TEST_URL=http://localhost:3123 node scripts/check-consent-network.mjs
      # Eight guards below were declared in scripts/test-all.mjs but had never been run by CI,
      # so `npm test` failed locally while every push showed green. check-legal-dataflow was
      # among them: the published privacy policy had stopped disclosing the entitlement fields
      # the agent actually transmits, and nothing caught it. check-chrome-a11y was in neither
      # list and had no runner at all. The coverage guard at the end of this job is what stops
      # this from recurring: adding a scripts/check-*.mjs and forgetting to wire it is now a
      # build failure rather than a silent gap.
      - name: Verify copy that must not drift (Team, activation, legal, docs, languages)
        run: |
          node scripts/check-team-paused.mjs
          node scripts/check-activation-copy.mjs
          node scripts/check-legal-copy.mjs
          node scripts/check-legal-dataflow.mjs
          node scripts/check-languages.mjs
          node scripts/check-doc-hygiene.mjs
      - name: Verify accessibility, routing and rendered a11y against the served site
        run: |
          PORT=3124 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3124/ >/dev/null && break; sleep 0.5; done
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-a11y.mjs
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-spa-routing.mjs
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-chrome-a11y.mjs
      - name: Verify every guard in scripts/ is actually wired into CI
        run: node scripts/check-ci-coverage.mjs
