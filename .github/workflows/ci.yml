name: CI

# Push-based CI (same-repo): a separate pull_request trigger would only duplicate
# runs on the same commit. Only skip files that are NOT part of the static build
# (build.js bundles the HTML/CSS/JS + public/, so those must still trigger CI).
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel superseded in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Marketing site is static and dependency-free: prove it builds, its assets
# resolve, and the deployable output is produced.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Committed-secret scan (zero-dependency, deterministic). High-confidence
      # patterns + length anchors so nothing in this static site false-positives.
      - name: Secret scan
        run: |
          if git grep -nIE 'sk_live_[0-9a-zA-Z]{20}|sk-ant-api[0-9a-zA-Z_-]{20}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sbp_[0-9a-f]{40}|re_[0-9a-zA-Z]{24}'; then
            echo "::error::Potential committed secret detected (see matches above)"; exit 1
          fi
          echo "No committed secrets detected."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Build-time devDependency only (esbuild, for asset minification). The
      # shipped site stays dependency-free at runtime.
      - name: Install build tooling
        run: npm ci
      - name: Build static site
        run: node build.js
      - name: Verify referenced assets resolve
        run: node scripts/check-assets.mjs
      - name: Verify documentation links resolve
        run: node scripts/check-doc-links.mjs
      - name: Verify localized highlights and full PDF guides are complete
        run: node scripts/check-docs.mjs
      - name: Verify responsive pages do not overflow
        run: node scripts/check-overflow.mjs
      # Mission Control pauses so visitors can read the report. Both pause sources were
      # edge-triggered pairs, and a finger only ever produces the first half of each, so
      # every tap froze the simulation permanently on a phone. This asserts a tap keeps
      # it running AND that hover/keyboard still pause it, so the freeze cannot be
      # "fixed" by deleting the feature.
      - name: Verify Mission Control cannot latch paused
        run: node scripts/check-mission-pause.mjs
      - name: Verify BugIt logo highlight is clipped (upper-corner artifact guard)
        run: node scripts/check-logo.mjs
      # The brand source of truth lives outside this repo and outside git, so CI
      # here cannot regenerate the assets to compare against them — which is why
      # brand staleness kept going unnoticed twice, each time as a pipeline step
      # that reported success into a folder nothing builds from. The sync now
      # writes a receipt of every file it wrote plus its hash; this re-hashes them
      # in the tree being built. check-brand-sync.mjs is itself generated and
      # covered by that receipt, so editing the detector fails the detector.
      - name: Verify brand assets match the brand pipeline
        run: node scripts/check-brand-sync.mjs
      - name: Verify trust cards have no retired glyphs beside their SVG icons
        run: node scripts/check-trust-icons.mjs
      # The 2026-08-12 audit (F-08) found five directly-filed trackers advertised as
      # needing an MCP server, because the localized lede was corrected and the grouping
      # beside it was not. This asserts the site matches tracker_routing.FILEABLE.
      - name: Verify tracker capability claims match what BugIt files to
        run: node scripts/check-tracker-claims.mjs
      - name: Verify Google Ads tag shape (single load, consent-first, CSP hosts)
        run: node scripts/check-ads-tag.mjs
      - name: Verify immutable caching is confined to content-hashed filenames
        run: node scripts/check-cache-headers.mjs
      # Its complement: cache-headers asks what may be cached, this asks what protects the
      # response. The site shipped without any Cross-Origin-Opener-Policy because no list said
      # which security headers it sends, so nothing could notice one missing.
      - name: Verify every required security header is sent on /*
        run: node scripts/check-security-headers.mjs
      - name: Verify the CSP grants no unused or undisclosed telemetry destination
        run: node scripts/check-csp-telemetry.mjs
      - name: Verify billing copy states a one-time payment in every locale
        run: node scripts/check-billing-copy.mjs
      - name: Verify build output exists
        run: |
          test -f dist/index.html
          # build.js content-hashes the CSS/JS bundles and DELETES the unhashed
          # originals (commit 485782a), so verify the hashed bundles exist rather
          # than the fixed dist/styles.css / dist/app.js names, which never survive a build.
          ls dist/styles.*.css  >/dev/null 2>&1 || { echo "::error::hashed styles.*.css bundle missing from dist"; exit 1; }
          ls dist/app.*.js      >/dev/null 2>&1 || { echo "::error::hashed app.*.js bundle missing from dist"; exit 1; }
          test -d dist/public
          echo "Static build verified."
      # Strict prior-consent Google-tag gating — real-browser NETWORK PROOF. Consent
      # Mode v2 denied-default pings are NOT sufficient for BugIt: zero Google requests
      # before consent and after Reject; the tag loads only after Accept. One lean job,
      # single Chromium, no matrix.
      - name: Install Chromium for the consent network test
        # WebKit as well as Chromium. check-disclosure.mjs runs the interaction contracts in
        # both, because the language menu shipped a defect that only Safari has: it does not
        # focus a button on tap, so the menu closed and reopened within one gesture and would
        # not collapse. Every other guard in this repo is Chromium-only and all of them passed.
        run: npx playwright install --with-deps chromium webkit
      - name: Prove strict prior-consent tag gating (browser network capture)
        run: |
          PORT=3123 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3123/ >/dev/null && break; sleep 0.5; done
          CONSENT_TEST_URL=http://localhost:3123 node scripts/check-consent-network.mjs
      # Eight guards below were declared in scripts/test-all.mjs but had never been run by CI,
      # so `npm test` failed locally while every push showed green. check-legal-dataflow was
      # among them: the published privacy policy had stopped disclosing the entitlement fields
      # the agent actually transmits, and nothing caught it. check-chrome-a11y was in neither
      # list and had no runner at all. The coverage guard at the end of this job is what stops
      # this from recurring: adding a scripts/check-*.mjs and forgetting to wire it is now a
      # build failure rather than a silent gap.
      - name: Verify copy that must not drift (Team, activation, legal, docs, languages)
        run: |
          node scripts/check-team-paused.mjs
          node scripts/check-activation-copy.mjs
          node scripts/check-legal-copy.mjs
          node scripts/check-legal-dataflow.mjs
          node scripts/check-languages.mjs
          node scripts/check-locale-crosstalk.mjs
          node scripts/check-doc-hygiene.mjs
          node scripts/check-doc-duplicates.mjs
          node scripts/check-doc-rendering.mjs
      - name: Verify accessibility, routing and rendered a11y against the served site
        run: |
          PORT=3124 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3124/ >/dev/null && break; sleep 0.5; done
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-a11y.mjs
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-spa-routing.mjs
          BASE_URL=http://localhost:3124 PORT=3124 node scripts/check-chrome-a11y.mjs
      # The product's own name rendered as "BUGIT" in two places on the home page, in all
      # eleven languages, because a shared CSS rule uppercased the strings. No source grep
      # could see it: the text is correct until the stylesheet is applied. This reads the
      # rendered page instead, and proves it can see the defect before it reports a pass.
      - name: Verify the product name is never rendered in the wrong casing
        run: node scripts/check-brand-casing.mjs
      # styles.css is three cascade layers and UNLAYERED rules outrank all of them, so one
      # stray brace silently promotes the old sheet above the redesign with no parse error
      # from anything. This asserts the layering and then measures the outcome it exists
      # for: every section on the page beginning on the same edge, in both directions.
      - name: Verify the stylesheet is fully layered and the page has one content edge
        run: node scripts/check-alignment.mjs
      # A reveal-on-scroll page fails by leaving text invisible, with no error anywhere.
      # This drives the whole page, section by section, and asserts that what a visitor is
      # looking at is readable, including under prefers-reduced-motion.
      - name: Verify no animation leaves content unreadable
        run: node scripts/check-motion.mjs
      # Every film on the channel exists as a 1920x1080 upload and as a 1080x1920 Short.
      # The page shipped pointing ten of twelve tiles at the Short, so a desktop played a
      # vertical video with black pillars over half the frame. Nothing could see it from the
      # source: the ids were real and the posters loaded. This presses play at both widths.
      - name: Verify the channel plays the cut that matches the screen
        run: node scripts/check-channel.mjs
      # sRGB has 256 levels and the ground crosses about 25 of them down a 4K screen, so
      # without a dither each level holds for ~90px and its edge reads as a band. This
      # measures the width of the plateaus at 3840x2160, and proves itself by putting the
      # old ground back and requiring a failure.
      - name: Verify the background has no contours at 4K
        run: node scripts/check-ground.mjs
      # Every heading on every documentation route once rendered at 18px, because a clamp()
      # written `1.35rem+ 2.1vw` is invalid and every font-size using it silently inherited.
      # This resolves every calculated token, then checks hierarchy, reading measure, the
      # contents list and the loading state on all nine routes.
      - name: Verify the documentation reads like a document
        run: node scripts/check-reading.mjs
      # THE 2026-08-21 AUDIT, KEPT AS THREE GUARDS.
      # Every check above reads one property of the page. These read the page the way a reader
      # meets it: eleven languages, five viewports, every route, at every scroll position.
      # What they found the first time they ran: an Arabic page that cut 104px off itself at
      # 320px because a `visibility:hidden` menu is still laid out, a Mission Control stream
      # line that truncated in ALL ELEVEN languages including English, six clamps sized for the
      # shortest language the product ships, and an instrument that grew 13.5px every time the
      # report was opened. None of them was visible to a string check or a source scan.
      # Fifteen guards render against server.js, so its death is fifteen false reports of a dead
      # site -- which is exactly how it presented: ERR_CONNECTION_REFUSED on job 3 of 55. One
      # malformed percent-escape threw inside the request handler and ended the process.
      - name: Verify one bad URL cannot kill the preview server
        run: node scripts/check-dev-server.mjs
      - name: Verify every language has room, on every screen, on every route
        run: node scripts/check-space.mjs
      - name: Verify every route in every language, entered cold, by click, by reload, by history
        run: node scripts/check-routing.mjs
      # Owner rule: the instrument may not change size when the report opens, or on its own.
      # The progress label CYCLES through every stage over 25 seconds, so whether a clip is on
      # screen when you look is luck: this shipped cutting text in six languages while the
      # space sweep called the page clean on one machine and failed it on another. This guard
      # measures every string the loop can write, and demands real headroom rather than a fit,
      # because the version that shipped had 4px to spare on the machine it was tuned on.
      - name: Verify the progress label fits every language it can show
        run: node scripts/check-progress-label.mjs
      - name: Verify Mission Control keeps its size
        run: node scripts/check-instrument-size.mjs
      # Reads the rendered page and asks the reader's question rather than the maintainer's:
      # on the Japanese page, is this sentence in Japanese? The film wall shipped twenty-four
      # English strings on ten translated pages and every existing language guard passed, because
      # all of them read the i18n object and the wall's copy was never in it.
      # The ten translated licences opened with `**Avertissement sur la traduction.**` -- the
      # asterisks on the page. The source was correct markdown and the corpus was consistent;
      # the licence just goes through a different renderer than PRIVACY and REFUND, and that
      # one printed the markers. No source scan and no parity check can see it. Only reading
      # the rendered page can.
      - name: Verify no document shows its own markup
        run: node scripts/check-doc-markup.mjs
      - name: Verify nothing renders in English on a translated page
        run: node scripts/check-untranslated.mjs
      # The header lockup, the language menu, the social labels and the footer links: present on
      # every route, and each of their defects is a property of an interaction or of one narrow
      # width, which is exactly what a page-level sweep steps over.
      - name: Verify the page chrome in every language
        run: node scripts/check-chrome.mjs
      # A reveal that never finishes leaves a card greyed out for ever, and the cause has no
      # visible connection to it: `overflow:hidden` on a grid makes that grid the scroll
      # container an `animation-timeline:view()` inside it resolves against, and a scroller that
      # cannot scroll is a timeline that never advances. Three cards shipped stranded at 0.31,
      # 0.57 and 0.71 opacity, and check-motion -- which asserts that reveals settle -- passed,
      # because it renders one viewport and reads only what is on screen.
      - name: Verify every scroll-driven reveal reaches the reader
        run: node scripts/check-reveal.mjs
      # The report's pinned action bar had a 46px gradient band above it AND a see-through top
      # to its own background, so the report faded out into a smear that travelled with it.
      # The stylesheet had already been corrected for this once and the correction never
      # applied: an identical-specificity rule later in the same layer restored the gradient.
      # Reading the source said the bar was solid; only the rendered page said otherwise.
      - name: Verify nothing is painted over the report
        run: node scripts/check-report-bar.mjs
      # THE ONLY STEP HERE THAT RUNS A SECOND ENGINE. A control that declares aria-expanded must
      # open and close again, by tap and by click, in WebKit as well as Chromium. Owner,
      # 2026-08-21: "language select on mobile view does not collapse by tapping the language
      # select button" -- true on an iPhone, false in every Chromium viewport this repo tests.
      # Safari does not move focus to a button on tap, so the focused row inside the open menu
      # blurred with relatedTarget=null, the "focus has left" handler closed the menu during
      # pointerdown, and the click that followed reopened it.
      - name: Verify every disclosure closes again, in both engines
        run: node scripts/check-disclosure.mjs
      # A CONTROL THAT OPENS AN OVERLAY MUST STILL WORK WHILE THE OVERLAY IS OPEN. Owner,
      # 2026-08-21: "pressing the 3 lines in mobile app to open the settings and then tapping it
      # again to close it crashes the entire google chrome", reproducible on an iPhone. The mobile
      # menu made the page behind it inert for screen readers by inerting every child of <body>
      # except itself -- and the hamburger lives in the <header>, which is one of those children.
      # inert is inherited and a descendant cannot opt out, so opening the menu removed its own
      # close button from hit-testing, on a page whose scroll was already locked behind it.
      # Every existing guard passed: the overlay opened, the classes and the aria were correct.
      # Playwright hid it too, because click({force}) dispatches an event a finger cannot. This
      # step taps honestly, in Chromium and WebKit, and carries its own negative control.
      # F-06 of the 2026-08-21 external audit: both declared language menus ignore the keyboard
      # contract their own role=menu markup promises. THIS STEP IS EXPECTED TO BE RED until the
      # last case is closed -- Space opens the language menu and WebKit puts focus back on the
      # button afterwards, so the arrows that follow go nowhere. It is wired anyway: an open
      # finding with a guard nobody runs is how F-06 survived two rounds of fixes in the first
      # place, and the website deploys by wrangler rather than from CI, so a red step here does
      # not block a release.
      - name: Verify every declared menu answers the keyboard, in both engines
        run: node scripts/check-menu-keyboard.mjs
      - name: Verify an overlay never disables the control that closes it
        run: node scripts/check-overlay-controls.mjs
      - name: Verify every guard in scripts/ is actually wired into CI
        run: node scripts/check-ci-coverage.mjs
